<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Urdu should prefer Nastaliq -->
    <match>
        <test name="lang" compare="contains">
            <string>ur</string>
        </test>
        <edit name="family" mode="assign">
            <string>Noto Nastaliq Urdu</string>
            <string>Noto Sans Arabic</string>
            <string>Noto Sans</string>
        </edit>
    </match>

    <!-- Fallback: Arabic script defaults to Nastaliq first -->
    <match>
        <test name="script">
            <string>arab</string>
        </test>
        <edit name="family" mode="assign">
            <string>Noto Nastaliq Urdu</string>
            <string>Noto Sans Arabic</string>
            <string>Noto Sans</string>
        </edit>
    </match>
</fontconfig>
